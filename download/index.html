<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPTV çıktısı indiriliyor</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(620px,100%);padding:28px;border:1px solid #334155;border-radius:18px;background:#1e293b;box-shadow:0 15px 50px #0006}h1{margin-top:0;font-size:clamp(1.35rem,4vw,2rem)}p{line-height:1.6;color:#cbd5e1}.status{margin:18px 0;padding:14px;border-radius:10px;background:#0f172a;color:#94a3b8}.status.ok{border-left:4px solid #22c55e;color:#bbf7d0}.status.error{border-left:4px solid #ef4444;color:#fecaca}a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border-radius:10px;background:#22c55e;color:#052e16;font-weight:800;text-decoration:none}a:hover,a:focus{filter:brightness(1.1);outline:3px solid #f97316;outline-offset:3px}.meta{font-size:.85rem;color:#94a3b8;word-break:break-word}
  </style>
</head>
<body>
  <main class="card">
    <h1>IPTV çıktısı hazır</h1>
    <div id="status" class="status">Çıktı hazırlanıyor…</div>
    <p id="help">İndirme otomatik başlamazsa aşağıdaki düğmeye basın.</p>
    <a id="download" hidden download>Dosyayı indir</a>
    <p id="meta" class="meta"></p>
  </main>
<script>
(function () {
  'use strict';
  const status = document.getElementById('status');
  const button = document.getElementById('download');
  const meta = document.getElementById('meta');

  function fromBase64Utf8(value) {
    const binary = atob(value);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  function fail(message) {
    status.textContent = message;
    status.className = 'status error';
    button.hidden = true;
  }

  try {
    const raw = location.hash.slice(1);
    if (!raw) throw new Error('Çıktı verisi bulunamadı.');
    const text = fromBase64Utf8(decodeURIComponent(raw));
    if (!text) throw new Error('Çıktı boş.');

    const params = new URLSearchParams(location.search);
    const type = params.get('type') === 'm3u' ? 'm3u' : 'txt';
    const filename = (params.get('name') || `iptv_hitler.${type}`).replace(/[^a-zA-Z0-9._-]/g, '_');
    const mime = type === 'm3u' ? 'audio/x-mpegurl;charset=utf-8' : 'text/plain;charset=utf-8';
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);

    button.href = url;
    button.download = filename;
    button.hidden = false;
    meta.textContent = `${filename} · ${(blob.size / 1024).toFixed(1)} KB`;
    status.textContent = 'İndirme hazır. Tarayıcı indirmeyi otomatik başlatmazsa düğmeye basın.';
    status.className = 'status ok';
    setTimeout(() => button.click(), 350);
    window.addEventListener('pagehide', () => URL.revokeObjectURL(url), { once: true });
  } catch (error) {
    fail(error.message || 'İndirme hazırlanamadı.');
  }
})();
</script>
</body>
</html>
